# Granola Tool - CLI for querying Granola meeting recordings and exporting to Obsidian

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0"
]

[project]
name = "granola-tool"
version = "0.3.2"
description = "CLI tool for querying Granola meeting recordings and exporting to Obsidian"
readme = "README.md"
authors = [
  {name = "Vlad Korolev", email = "vlad@v-lad.org"}
]
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
  "typer>=0.12.0",
  "structlog>=24.0",
  "sentry-sdk>=2.0.0",
  "pydantic-settings>=2.0.0"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

[project.urls]
Homepage = "https://github.com/vladistan/granola-tool"
Repository = "https://github.com/vladistan/granola-tool"
Issues = "https://github.com/vladistan/granola-tool/issues"

[project.scripts]
granola-tool = "granola_tool.cli:main"

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod"
]

[tool.coverage.run]
source = ["src/granola_tool"]
omit = [
  "*/tests/*",
  "*/test_*.py",
  "*/__about__.py",
  "*/__pycache__/*"
]

[tool.hatch.build.targets.wheel]
packages = ["src/granola_tool"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
exclude = [".venv", "build", "dist"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "N", # pep8-naming
  "B", # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "RUF", # ruff-specific rules
  "ERA", # eradicate
  "PL", # pylint
  "PERF" # performance
]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["granola_tool"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["ARG", "S101", "PLR2004"]
